idempotency.processing-delay-ms=200
idempotency.key.ttl-hours=24
idempotency.purge-interval-ms=3600000

# Overrides ${DB_PASSWORD} from the main file so the context can start.
# Testcontainers @ServiceConnection then replaces url/user/password with the container.
spring.datasource.password=test
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
